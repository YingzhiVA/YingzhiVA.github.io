<!doctype html>
<!--
  og:image generator for field note No. 01.
  Renders to notes/referral-analytics/encoder-first/leakage-card.png via _og/render.sh

  The SVG below is a COPY of the hero diagram in
  notes/referral-analytics/encoder-first/index.html. Edit one, mirror the other.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* light palette only: social cards render on the platform's own ground */
  :root {
    --ground: #f1eff4;
    --surface: #fbfafc;
    --surface-2: #e9e6ee;
    --ink: #201a2b;
    --muted: #5f5670;
    --faint: #8d84a0;
    --hairline: #dcd7e3;
    --accent: #7b3fa0;
    --accent-ink: #5f2e7d;
    --low: #1a6fc4;
    --high: #c62258;
    --low-wash: rgba(26,111,196,.12);
    --high-wash: rgba(198,34,88,.11);
    --sans: "Ubuntu Sans", "Ubuntu", sans-serif;
    --mono: "Ubuntu Mono", monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background:
      radial-gradient(120% 80% at 92% -10%, var(--high-wash), transparent 60%),
      radial-gradient(90% 70% at 0% 0%, var(--low-wash), transparent 55%),
      var(--ground);
    color: var(--ink);
    padding: 56px;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 18px;
    line-height: 1;
    letter-spacing: .22em;
    text-transform: uppercase;
    color: var(--accent-ink);
    font-weight: 700;
    margin-bottom: 18px;
  }
  h1 {
    font-family: var(--sans);
    font-weight: 800;
    font-size: 52px;
    line-height: 1.05;
    letter-spacing: -.028em;
    margin-bottom: 24px;
  }

  /* 957 keeps the 660x278 diagram inside the same vertical band the
     No. 02 card gives its 660x250 one, so the pair shares its margins */
  figure {
    width: 957px;
    border: 1px solid var(--hairline);
    border-radius: 4px;
    background: var(--surface);
    overflow: hidden;
  }
  figure svg { display: block; width: 100%; height: auto; }

  .dg-head { font-family: var(--sans); font-size: 13px; font-weight: 700; fill: var(--ink); }
  .dg-note { font-family: var(--sans); font-size: 11.5px; fill: var(--muted); }
  .dg-block { fill: var(--surface-2); stroke: var(--hairline); }
  .dg-val { fill: var(--low-wash); stroke: var(--low); }
  .dg-val-t { font-family: var(--mono); font-size: 9.5px; letter-spacing: .06em; text-transform: uppercase; fill: var(--low); }
  .dg-bad { stroke: var(--high); fill: none; }
  .dg-bad-t { fill: var(--high); font-family: var(--sans); font-size: 11.5px; font-weight: 600; }
  .dg-ok { stroke: var(--accent); fill: none; }
  .dg-ok-t { fill: var(--accent-ink); font-family: var(--sans); font-size: 11.5px; font-weight: 600; }
  .dg-rule { stroke: var(--hairline); }
</style>
</head>
<body>

</html>
